name: rag-qdrant

# ALTERNATE option: a local Qdrant instead of the default Qdrant Cloud free
# cluster. Use this if you'd rather not sign up for cloud.qdrant.io, or want
# a fully offline setup.
#
# After `docker compose -f docker-compose.qdrant.yml up -d`, connect it to
# whatever docker network your n8n container is on, e.g.:
#   docker network connect <your-n8n-network> rag-qdrant
# then n8n can reach it at http://rag-qdrant:6333 (or alias it to "qdrant",
# see README). Point your "Qdrant" credential in n8n at this URL with an
# empty API key instead of your cloud cluster's URL/key.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
